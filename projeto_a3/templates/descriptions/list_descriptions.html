{% extends 'base.html' %}

{% block title %}
  Lista de Descrições - {{ block.super }}
{% endblock %}

{% block body %}
  <br />
  <b>Lista de Descrições</b>
  <br />
  <br />
  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descricao</th>
      </tr>
    </thead>
    <tbody>
      {% for description in descriptions %}
        <tr>
          <th>{{ description.id }}</th>
          <td>{{ description.category }}</td>
          <td>{{ description.description }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
